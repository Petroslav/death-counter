name: Windows portable build
on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -v
      - run: python prepare_models.py
      - run: python -m PyInstaller --noconfirm DeathCounter.spec
      - name: Test packaged app
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'death-counter-smoke.json'
          $process = Start-Process -FilePath '.\dist\DeathCounter\DeathCounter.exe' -ArgumentList @('--self-test', $result) -PassThru -WindowStyle Hidden
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged self-test timed out' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $result)) { throw 'Packaged self-test failed' }
          $report = Get-Content $result -Raw | ConvertFrom-Json
          if (-not $report.ok) { throw ($report | ConvertTo-Json) }
      - uses: actions/upload-artifact@v4
        with:
          name: DeathCounter-Windows-portable
          path: dist/DeathCounter/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DeathCounter-Windows-portable
          path: DeathCounter
      - shell: pwsh
        run: Compress-Archive -Path DeathCounter -DestinationPath DeathCounter-Windows-portable.zip
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create $env:RELEASE_TAG DeathCounter-Windows-portable.zip --verify-tag --title $env:RELEASE_TAG --generate-notes
